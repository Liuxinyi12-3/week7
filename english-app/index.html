<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🌟 Let's Learn English!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===== Global ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', 'Fredoka', sans-serif;
    background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #a29bfe 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    padding: 32px 28px;
    position: relative;
    overflow: hidden;
  }

  /* Decorative bubbles */
  .app::before {
    content: '🎈';
    position: absolute;
    top: 10px; left: 10px;
    font-size: 28px;
    opacity: 0.7;
  }
  .app::after {
    content: '🌈';
    position: absolute;
    top: 10px; right: 10px;
    font-size: 28px;
    opacity: 0.7;
  }

  /* ===== Screens ===== */
  .screen {
    display: none;
    text-align: center;
    animation: fadeIn 0.4s ease-out;
  }
  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }
  @keyframes pop {
    0%   { transform: scale(0.8); opacity: 0; }
    60%  { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes confetti-fall {
    to { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Home Screen ===== */
  .home__hero {
    font-size: 72px;
    animation: bounce 2s ease-in-out infinite;
    margin-bottom: 8px;
  }
  .home__title {
    font-family: 'Fredoka', 'Nunito', sans-serif;
    font-size: 36px;
    font-weight: 700;
    color: #6c5ce7;
    line-height: 1.2;
    margin-bottom: 12px;
    text-shadow: 2px 2px 0 #ffeaa7;
  }
  .home__title span { color: #e17055; }
  .home__subtitle {
    font-size: 18px;
    color: #636e72;
    margin-bottom: 32px;
    font-weight: 600;
  }
  .home__start {
    background: linear-gradient(135deg, #fd79a8, #e17055);
    color: #fff;
    font-family: 'Fredoka', sans-serif;
    font-size: 24px;
    font-weight: 700;
    padding: 18px 60px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 0 #d63031, 0 12px 24px rgba(225,112,85,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .home__start:hover { transform: translateY(-2px); }
  .home__start:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 #d63031, 0 6px 12px rgba(225,112,85,0.4);
  }

  /* ===== Question Screen ===== */
  .q__counter {
    font-size: 16px;
    font-weight: 700;
    color: #a29bfe;
    margin-bottom: 4px;
  }
  .q__prompt {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: #2d3436;
    margin-bottom: 16px;
  }
  .q__image-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .q__image {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 28px;
    border: 6px solid #ffeaa7;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    animation: wiggle 3s ease-in-out infinite;
    background: #fff;
  }
  .q__options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .q__option {
    position: relative;
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    font-weight: 600;
    padding: 18px 12px;
    border: 4px solid #dfe6e9;
    border-radius: 22px;
    background: #fff;
    color: #2d3436;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 4px 0 #b2bec3;
  }
  .q__option:hover:not(:disabled) {
    border-color: #fd79a8;
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #fd79a8;
  }
  .q__option:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #b2bec3;
  }
  .q__option:disabled { cursor: default; }

  /* Feedback markers */
  .q__option--wrong {
    border-color: #d63031 !important;
    background: #ffe0e0 !important;
    color: #d63031 !important;
    box-shadow: 0 4px 0 #d63031 !important;
  }
  .q__option--correct {
    border-color: #00b894 !important;
    background: #d0f4e8 !important;
    color: #00b894 !important;
    box-shadow: 0 4px 0 #00b894 !important;
    animation: pop 0.4s ease-out;
  }
  .q__mark {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    animation: pop 0.3s ease-out;
  }
  .q__mark--wrong { background: #d63031; }
  .q__mark--correct { background: #00b894; }

  /* Progress dots */
  .q__progress {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .q__dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #dfe6e9;
    transition: all 0.3s;
  }
  .q__dot.done { background: #00b894; transform: scale(1.15); }
  .q__dot.current { background: #fd79a8; transform: scale(1.2); }

  /* ===== Victory Screen ===== */
  .victory__hero {
    font-size: 80px;
    margin-bottom: 8px;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .victory__title {
    font-family: 'Fredoka', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #00b894;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #d0f4e8;
  }
  .victory__msg {
    font-size: 18px;
    color: #636e72;
    margin-bottom: 24px;
    font-weight: 600;
  }
  .victory__star-row {
    font-size: 40px;
    margin-bottom: 24px;
    letter-spacing: 8px;
  }
  .victory__replay {
    background: linear-gradient(135deg, #00b894, #55efc4);
    color: #fff;
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    font-weight: 700;
    padding: 14px 48px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #00a381, 0 10px 20px rgba(0,184,148,0.4);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .victory__replay:hover { transform: translateY(-2px); }
  .victory__replay:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #00a381;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 18px;
    pointer-events: none;
    z-index: 100;
    animation: confetti-fall 3s linear forwards;
  }

  /* ===== Responsive ===== */
  @media (max-width: 400px) {
    .app { padding: 28px 20px; }
    .home__title { font-size: 28px; }
    .q__image { width: 140px; height: 140px; }
    .q__option { font-size: 17px; padding: 14px 8px; }
    .victory__title { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">
    <div class="home__hero">🦊</div>
    <h1 class="home__title">Let's <span>learn</span><br />English!</h1>
    <p class="home__subtitle">Tap Start and find out the word! ✨</p>
    <button class="home__start" id="btnStart">▶ Start</button>
  </div>

  <!-- QUESTION SCREEN -->
  <div class="screen" id="screen-question">
    <div class="q__progress" id="qProgress">
      <span class="q__dot current"></span>
      <span class="q__dot"></span>
      <span class="q__dot"></span>
    </div>
    <div class="q__counter" id="qCounter">Question 1 / 3</div>
    <div class="q__prompt">What is this? 🤔</div>
    <div class="q__image-wrap">
      <img class="q__image" id="qImage" src="" alt="Question" />
    </div>
    <div class="q__options" id="qOptions">
      <!-- buttons injected by JS -->
    </div>
  </div>

  <!-- VICTORY SCREEN -->
  <div class="screen" id="screen-victory">
    <div class="victory__hero">🏆</div>
    <h2 class="victory__title">You did it! 🎉</h2>
    <p class="victory__msg">Great job, little learner!<br />You know all the words!</p>
    <div class="victory__star-row">⭐⭐⭐</div>
    <button class="victory__replay" id="btnReplay">🔁 Play again</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  // --- Question data (AI-generated 3D cartoon jpg files in same folder) ---
  const questions = [
    { image: '1.jpg', correct: 'apple', options: ['apple', 'banana', 'pear', 'grape'] },
    { image: '2.jpg', correct: 'dog',   options: ['dog', 'cat', 'mouse', 'bird'] },
    { image: '3.jpg', correct: 'eye',   options: ['eye', 'hand', 'foot', 'nose'] }
  ];

  // --- State ---
  let currentQ = 0;

  // --- DOM refs ---
  const $ = id => document.getElementById(id);
  const screenHome    = $('screen-home');
  const screenQ       = $('screen-question');
  const screenVictory = $('screen-victory');
  const btnStart      = $('btnStart');
  const btnReplay     = $('btnReplay');
  const qImage        = $('qImage');
  const qCounter      = $('qCounter');
  const qOptions      = $('qOptions');
  const qProgress     = $('qProgress');

  // --- Helpers ---
  function showScreen(screen) {
    [screenHome, screenQ, screenVictory].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderProgress() {
    const dots = qProgress.querySelectorAll('.q__dot');
    dots.forEach((d, i) => {
      d.classList.remove('done', 'current');
      if (i < currentQ) d.classList.add('done');
      else if (i === currentQ) d.classList.add('current');
    });
  }

  function renderQuestion() {
    const q = questions[currentQ];
    qImage.src = q.image;
    qCounter.textContent = `Question ${currentQ + 1} / ${questions.length}`;
    qOptions.innerHTML = '';

    const shuffled = shuffle(q.options);
    shuffled.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'q__option';
      btn.type = 'button';
      btn.textContent = opt;
      btn.dataset.value = opt;
      btn.addEventListener('click', () => handleAnswer(btn, opt));
      qOptions.appendChild(btn);
    });

    renderProgress();
  }

  function handleAnswer(btn, value) {
    const q = questions[currentQ];
    if (value === q.correct) {
      // Correct! Mark green, disable all, advance after short delay
      btn.classList.add('q__option--correct');
      const mark = document.createElement('span');
      mark.className = 'q__mark q__mark--correct';
      mark.textContent = '✓';
      btn.appendChild(mark);

      Array.from(qOptions.children).forEach(b => b.disabled = true);

      setTimeout(() => {
        currentQ++;
        if (currentQ >= questions.length) {
          showVictory();
        } else {
          renderQuestion();
        }
      }, 900);
    } else {
      // Wrong! Mark red, keep options active
      btn.classList.add('q__option--wrong');
      const mark = document.createElement('span');
      mark.className = 'q__mark q__mark--wrong';
      mark.textContent = '✗';
      btn.appendChild(mark);
      // Disable only this wrong button so it can't be clicked again
      btn.disabled = true;
    }
  }

  // --- Victory screen with confetti ---
  function showVictory() {
    showScreen(screenVictory);
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#fd79a8', '#fdcb6e', '#00b894', '#74b9ff', '#a29bfe', '#e17055'];
    const shapes = ['●', '■', '▲'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = shapes[Math.floor(Math.random() * shapes.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.color = colors[Math.floor(Math.random() * colors.length)];
      c.style.fontSize = (12 + Math.random() * 16) + 'px';
      c.style.animationDuration = (2 + Math.random() * 2) + 's';
      c.style.animationDelay = (Math.random() * 0.8) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4500);
    }
  }

  // --- Events ---
  btnStart.addEventListener('click', () => {
    currentQ = 0;
    showScreen(screenQ);
    renderQuestion();
  });

  btnReplay.addEventListener('click', () => {
    currentQ = 0;
    qOptions.innerHTML = '';
    const dots = qProgress.querySelectorAll('.q__dot');
    dots.forEach((d, i) => {
      d.classList.remove('done', 'current');
      if (i === 0) d.classList.add('current');
    });
    showScreen(screenHome);
  });

})();
</script>
</body>
</html>
